      if (window.location.protocol === 'file:' && !window.location.pathname.endsWith('CHAY_TRUC_TIEP.html')) {
        window.location.replace('CHAY_TRUC_TIEP.html' + (window.location.hash || '#/'));

    <script>
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'aptis_chunk_reload_count';
          var count = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (count < 2) {
            sessionStorage.setItem(key, String(count + 1));
            window.location.reload(true);
          }
        }
      }, true);
    </script>
